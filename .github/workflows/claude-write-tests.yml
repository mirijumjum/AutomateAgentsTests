name: claude-write-tests

# Se dispara al poner la etiqueta "generar-tests" en una PR.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  write-tests:
    # Solo con la etiqueta correcta, PRs del propio repo (los forks no tienen
    # secrets) y nunca sobre PRs creadas por Claude (evita bucles).
    if: >-
      github.event.label.name == 'generar-tests' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            RAMA DE LA PR: ${{ github.event.pull_request.head.ref }}

            Tu tarea es escribir los tests que faltan en esta pull request.

            1. Lee el diff (`gh pr diff ${{ github.event.pull_request.number }}`) y los
               tests existentes en tests/ para seguir su estilo.
            2. Identifica los cambios de comportamiento sin tests y los casos límite
               (listas vacías, divisiones por cero, valores negativos o flotantes).
            3. Configura git: `git config user.name "claude[bot]"` y
               `git config user.email "claude[bot]@users.noreply.github.com"`.
            4. Crea la rama `claude/tests-pr-${{ github.event.pull_request.number }}`
               desde la rama actual.
            5. Escribe los tests SOLO en tests/ (amplía tests/test_calculadora.py o crea
               archivos nuevos). NO modifiques nada en src/ ni los tests existentes. Si el
               comportamiento actual de una función es discutible (p. ej. ZeroDivisionError
               en media([])), escribe el test que describa el comportamiento ACTUAL y
               menciónalo en la descripción de la PR.
            6. Ejecuta `python -m pytest -v`.
            7. Si TODOS los tests pasan: haz commit, `git push -u origin HEAD` y abre una
               PR con `gh pr create --base ${{ github.event.pull_request.head.ref }}
               --title "Añade tests para PR #${{ github.event.pull_request.number }}"
               --body "..."`. La descripción debe estar en español y resumir qué cubren
               los tests y el resultado de pytest.
            8. Si algún test falla y no puedes arreglarlo cambiando solo los tests: NO
               crees ninguna PR; publica un comentario en la PR original con
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`
               explicando qué falló.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(python -m pytest:*),Bash(git config:*),Bash(git checkout:*),Bash(git switch:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr comment:*)"
